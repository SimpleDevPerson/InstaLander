name: instalander
description: "InstaLander - Instagram follower report"
publish_to: 'none'
version: 0.6.0+2006

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  file_picker: ^13.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  url_launcher: ^6.2.5
  intl: ^0.20.3
  archive: ^4.6.0
  google_mobile_ads: 9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Newer KTS-based Android plugins cannot resolve Flutter's injected Gradle extension.
  shared_preferences_android: "2.5.4"
  webview_flutter_android: "4.10.9"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
